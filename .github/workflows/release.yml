name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload artifacts (useful for testing)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

  govulncheck:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Security scan — govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build-binaries:
    name: Build Binary (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    needs: [lint, test, govulncheck]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm
            goarm: '6'
            suffix: arm6
          - goos: linux
            goarch: arm64
            suffix: arm64
          - goos: linux
            goarch: amd64
            suffix: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          go build -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildCommit=${COMMIT}" \
            -o logfalcon-${{ matrix.suffix }} ./cmd/logfalcon

      - name: Binary size gate
        run: |
          BINARY="logfalcon-${{ matrix.suffix }}"
          SIZE_BYTES=$(stat -c%s "$BINARY")
          SIZE_MB=$(( SIZE_BYTES / 1024 / 1024 ))
          LIMIT_MB=10
          LIMIT_BYTES=$(( LIMIT_MB * 1024 * 1024 ))
          echo "${{ matrix.suffix }} binary: $(du -h "$BINARY" | cut -f1) ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::${{ matrix.suffix }} binary is ${SIZE_MB} MB — exceeds ${LIMIT_MB} MB limit"
            exit 1
          fi
          echo "Binary size OK: ${SIZE_MB} MB <= ${LIMIT_MB} MB"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: logfalcon-${{ matrix.suffix }}
          path: logfalcon-${{ matrix.suffix }}
          retention-days: 7

  build-image:
    name: Build SD Card Image
    runs-on: ubuntu-latest
    needs: [lint, test, govulncheck]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install QEMU for ARM emulation
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Cross-compile logfalcon for ARM
        run: |
          make build-pi
          make build-pi2
          cp bin/logfalcon-arm6 bin/logfalcon
          ls -la bin/

      - name: Binary size gate — ARM6
        run: |
          BINARY="bin/logfalcon-arm6"
          if [ ! -f "$BINARY" ]; then
            echo "::error::ARM6 binary not found at $BINARY"
            exit 1
          fi
          SIZE_BYTES=$(stat -c%s "$BINARY")
          SIZE_MB=$(( SIZE_BYTES / 1024 / 1024 ))
          LIMIT_MB=10
          LIMIT_BYTES=$(( LIMIT_MB * 1024 * 1024 ))
          echo "ARM6 binary: $(du -h "$BINARY" | cut -f1) ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::ARM6 binary is ${SIZE_MB} MB — exceeds ${LIMIT_MB} MB limit"
            exit 1
          fi
          echo "Binary size OK: ${SIZE_MB} MB <= ${LIMIT_MB} MB"

      - name: Clone pi-gen
        run: git clone --depth 1 --branch bookworm https://github.com/RPi-Distro/pi-gen.git pi-gen/pi-gen-repo

      - name: Configure pi-gen
        run: |
          cp pi-gen/config pi-gen/pi-gen-repo/config
          rm -rf pi-gen/pi-gen-repo/stage-logfalcon
          cp -r pi-gen/stage-logfalcon pi-gen/pi-gen-repo/stage-logfalcon
          rm -rf pi-gen/pi-gen-repo/logfalcon-src
          rsync -a --exclude='.git' --exclude='pi-gen' \
              ./ pi-gen/pi-gen-repo/logfalcon-src/
          touch pi-gen/pi-gen-repo/stage3/SKIP pi-gen/pi-gen-repo/stage3/SKIP_IMAGES
          touch pi-gen/pi-gen-repo/stage4/SKIP pi-gen/pi-gen-repo/stage4/SKIP_IMAGES
          touch pi-gen/pi-gen-repo/stage5/SKIP pi-gen/pi-gen-repo/stage5/SKIP_IMAGES
          touch pi-gen/pi-gen-repo/stage2/SKIP_IMAGES

      - name: Build image
        run: |
          cd pi-gen/pi-gen-repo
          ./build-docker.sh
        env:
          CLEAN: 1
          CONTINUE: 0
          PRESERVE_CONTAINER: 0

      - name: Shrink and compress image
        run: |
          find pi-gen/pi-gen-repo/deploy -maxdepth 1 -type f -print || true
          cd pi-gen/pi-gen-repo/deploy

          IMAGE_FILE=$(find . -maxdepth 1 -type f -name '*.img' -printf '%f\n' | sort | head -n 1)
          if [ -z "$IMAGE_FILE" ]; then
            echo "::error::No .img file found in deploy directory"
            exit 1
          fi

          # Install PiShrink pinned to a specific commit (v0.1.3 — d2c55e5)
          # instead of the mutable master branch.
          wget -qO /usr/local/bin/pishrink.sh \
            https://raw.githubusercontent.com/Drewsif/PiShrink/d2c55e5/pishrink.sh
          chmod +x /usr/local/bin/pishrink.sh

          RAW_SIZE=$(du -h "$IMAGE_FILE" | cut -f1)
          echo "Raw image:      $RAW_SIZE  ($IMAGE_FILE)"

          sudo /usr/local/bin/pishrink.sh "$IMAGE_FILE"
          SHRUNK_SIZE=$(du -h "$IMAGE_FILE" | cut -f1)
          echo "After PiShrink: $SHRUNK_SIZE  ($IMAGE_FILE)"

          # ── Image size gate ─────────────────────────────────────────────────
          SHRUNK_BYTES=$(stat -c%s "$IMAGE_FILE")
          SHRUNK_MB=$(( SHRUNK_BYTES / 1024 / 1024 ))
          IMAGE_LIMIT_MB=600
          IMAGE_LIMIT_BYTES=$(( IMAGE_LIMIT_MB * 1024 * 1024 ))

          echo "Shrunk image size: ${SHRUNK_MB} MB ($SHRUNK_BYTES bytes)"

          if [ "$SHRUNK_BYTES" -ge "$IMAGE_LIMIT_BYTES" ]; then
            echo "::error::Image size ${SHRUNK_MB} MB >= ${IMAGE_LIMIT_MB} MB limit — size regression detected"
            exit 1
          fi

          echo "Image size OK: ${SHRUNK_MB} MB < ${IMAGE_LIMIT_MB} MB"

          xz -9 -T0 "$IMAGE_FILE"
          FINAL_SIZE=$(du -h "${IMAGE_FILE}.xz" | cut -f1)
          echo "Compressed:     $FINAL_SIZE  (${IMAGE_FILE}.xz)"

          {
            echo "## Image sizes"
            echo "| Stage | Size |"
            echo "|---|---|"
            echo "| Raw .img | $RAW_SIZE |"
            echo "| After PiShrink | $SHRUNK_SIZE |"
            echo "| Final .img.xz | $FINAL_SIZE |"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "IMAGE_FILE=$IMAGE_FILE"
            echo "IMAGE_PATH=pi-gen/pi-gen-repo/deploy/${IMAGE_FILE}.xz"
          } >> "$GITHUB_ENV"

      - name: Inspect image (non-gating for manual runs)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          cd pi-gen/pi-gen-repo/deploy
          bash "$GITHUB_WORKSPACE/scripts/inspect-image.sh" "${IMAGE_FILE}.xz" || true

      - name: Inspect image (gating for tag releases)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd pi-gen/pi-gen-repo/deploy
          bash "$GITHUB_WORKSPACE/scripts/inspect-image.sh" "${IMAGE_FILE}.xz"

      - name: Upload image artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload_artifact) }}
        uses: actions/upload-artifact@v4
        with:
          name: logfalcon-image
          path: ${{ env.IMAGE_PATH }}
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-image]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: logfalcon-*

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name 'logfalcon-*' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum logfalcon-* > checksums.txt
          cd ..
          cat release-assets/checksums.txt

      - name: Assert release assets
        run: |
          cd release-assets
          required=("logfalcon-arm6" "logfalcon-arm64" "logfalcon-amd64" "checksums.txt")
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required release asset: $f"
              exit 1
            fi
          done
          if [ -z "$(find . -maxdepth 1 -type f -name 'logfalcon-*.img.xz')" ]; then
            echo "::error::Missing required release asset: logfalcon-*.img.xz"
            exit 1
          fi
          echo "All required release assets present:"
          find . -maxdepth 1 -type f | sort

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
