name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload artifacts (useful for testing)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'

      - uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.15.0

  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

  govulncheck:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'

      - name: Security scan — govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  build-binaries:
    name: Build Binary (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    needs: [lint, test, govulncheck]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm
            goarm: '6'
            suffix: arm6
          - goos: linux
            goarch: arm64
            suffix: arm64
          - goos: linux
            goarch: amd64
            suffix: amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="$GITHUB_REF_NAME"; else VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev"); fi
          COMMIT=$(git rev-parse HEAD)
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildCommit=${COMMIT}" \
            -o logfalcon-${{ matrix.suffix }} ./cmd/logfalcon

      - name: Build and verify signed offline update
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_SIGNING_SEED: ${{ secrets.UPDATE_SIGNING_SEED }}
          UPDATE_SIGNING_KEY_ID: ${{ vars.UPDATE_SIGNING_KEY_ID }}
        run: |
          test -n "$UPDATE_SIGNING_SEED" || { echo "::error::UPDATE_SIGNING_SEED is required"; exit 1; }
          test -n "$UPDATE_SIGNING_KEY_ID" || { echo "::error::UPDATE_SIGNING_KEY_ID is required"; exit 1; }
          go run ./cmd/update-package -binary logfalcon-${{ matrix.suffix }} -version "$GITHUB_REF_NAME" -commit "$GITHUB_SHA" -arch ${{ matrix.suffix }} -key-id "$UPDATE_SIGNING_KEY_ID" -out "logfalcon-$GITHUB_REF_NAME-${{ matrix.suffix }}.lfu"
          go run ./cmd/update-package -verify "logfalcon-$GITHUB_REF_NAME-${{ matrix.suffix }}.lfu" -arch ${{ matrix.suffix }}

      - name: Upload signed update
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logfalcon-update-${{ matrix.suffix }}
          path: logfalcon-*.lfu
          if-no-files-found: error

      - name: Binary size gate

        run: |
          BINARY="logfalcon-${{ matrix.suffix }}"
          SIZE_BYTES=$(stat -c%s "$BINARY")
          SIZE_MB=$(( SIZE_BYTES / 1024 / 1024 ))
          LIMIT_MB=10
          LIMIT_BYTES=$(( LIMIT_MB * 1024 * 1024 ))
          echo "${{ matrix.suffix }} binary: $(du -h "$BINARY" | cut -f1) ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::${{ matrix.suffix }} binary is ${SIZE_MB} MB — exceeds ${LIMIT_MB} MB limit"
            exit 1
          fi
          echo "Binary size OK: ${SIZE_MB} MB <= ${LIMIT_MB} MB"

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logfalcon-${{ matrix.suffix }}
          path: logfalcon-${{ matrix.suffix }}
          retention-days: 7

  build-image:
    name: Build SD Card Image
    runs-on: ubuntu-latest
    needs: [lint, test, govulncheck]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install QEMU for ARM emulation
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Cross-compile logfalcon for ARM
        run: |
          make VERSION="$GITHUB_REF_NAME" build-pi
          make VERSION="$GITHUB_REF_NAME" build-pi2
          cp bin/logfalcon-arm6 bin/logfalcon
          ls -la bin/

      - name: Binary size gate — ARM6
        run: |
          BINARY="bin/logfalcon-arm6"
          if [ ! -f "$BINARY" ]; then
            echo "::error::ARM6 binary not found at $BINARY"
            exit 1
          fi
          SIZE_BYTES=$(stat -c%s "$BINARY")
          SIZE_MB=$(( SIZE_BYTES / 1024 / 1024 ))
          LIMIT_MB=10
          LIMIT_BYTES=$(( LIMIT_MB * 1024 * 1024 ))
          echo "ARM6 binary: $(du -h "$BINARY" | cut -f1) ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::ARM6 binary is ${SIZE_MB} MB — exceeds ${LIMIT_MB} MB limit"
            exit 1
          fi
          echo "Binary size OK: ${SIZE_MB} MB <= ${LIMIT_MB} MB"

      - name: Clone pi-gen
        run: |
          git init pi-gen/pi-gen-repo
          git -C pi-gen/pi-gen-repo remote add origin https://github.com/RPi-Distro/pi-gen.git
          git -C pi-gen/pi-gen-repo fetch --depth 1 origin 1c2abf50924d5bfee3527657af74ddfb1da52904
          git -C pi-gen/pi-gen-repo checkout --detach FETCH_HEAD

      - name: Configure pi-gen
        run: |
          cp pi-gen/config pi-gen/pi-gen-repo/config
          rm -rf pi-gen/pi-gen-repo/stage-logfalcon
          cp -r pi-gen/stage-logfalcon pi-gen/pi-gen-repo/stage-logfalcon
          rm -rf pi-gen/pi-gen-repo/logfalcon-src
          rsync -a --exclude='.git' --exclude='pi-gen' \
              ./ pi-gen/pi-gen-repo/logfalcon-src/
          touch pi-gen/pi-gen-repo/stage3/SKIP pi-gen/pi-gen-repo/stage3/SKIP_IMAGES
          touch pi-gen/pi-gen-repo/stage4/SKIP pi-gen/pi-gen-repo/stage4/SKIP_IMAGES
          touch pi-gen/pi-gen-repo/stage5/SKIP pi-gen/pi-gen-repo/stage5/SKIP_IMAGES
          touch pi-gen/pi-gen-repo/stage2/SKIP_IMAGES

      - name: Build image
        run: |
          cd pi-gen/pi-gen-repo
          ./build-docker.sh
        env:
          CLEAN: 1
          CONTINUE: 0
          PRESERVE_CONTAINER: 0

      - name: Shrink and compress image
        run: |
          find pi-gen/pi-gen-repo/deploy -maxdepth 1 -type f -print || true
          cd pi-gen/pi-gen-repo/deploy

          IMAGE_FILE=$(find . -maxdepth 1 -type f -name '*.img' -printf '%f\n' | sort | head -n 1)
          if [ -z "$IMAGE_FILE" ]; then
            echo "::error::No .img file found in deploy directory"
            exit 1
          fi

          # Install PiShrink pinned to a specific commit (5f358d03eed4b7334657ee93867826a2b42f112a)
          # instead of the mutable master branch.
          wget -qO /usr/local/bin/pishrink.sh \
            https://raw.githubusercontent.com/Drewsif/PiShrink/5f358d03eed4b7334657ee93867826a2b42f112a/pishrink.sh
          chmod +x /usr/local/bin/pishrink.sh

          RAW_SIZE=$(du -h "$IMAGE_FILE" | cut -f1)
          echo "Raw image:      $RAW_SIZE  ($IMAGE_FILE)"

          sudo /usr/local/bin/pishrink.sh "$IMAGE_FILE"
          SHRUNK_SIZE=$(du -h "$IMAGE_FILE" | cut -f1)
          echo "After PiShrink: $SHRUNK_SIZE  ($IMAGE_FILE)"

          # Raw flash image: up to 3 GiB (pi-gen boot alone is 512 MiB).
          bash "$GITHUB_WORKSPACE/scripts/check-image-size.sh" raw "$IMAGE_FILE"

          xz -9 -T0 "$IMAGE_FILE"
          FINAL_SIZE=$(du -h "${IMAGE_FILE}.xz" | cut -f1)
          echo "Compressed:     $FINAL_SIZE  (${IMAGE_FILE}.xz)"
          # Download budget applies to the compressed artifact, not the raw disk.
          bash "$GITHUB_WORKSPACE/scripts/check-image-size.sh" compressed "${IMAGE_FILE}.xz"

          {
            echo "## Image sizes"
            echo "| Stage | Size |"
            echo "|---|---|"
            echo "| Raw .img | $RAW_SIZE |"
            echo "| After PiShrink | $SHRUNK_SIZE |"
            echo "| Final .img.xz | $FINAL_SIZE |"
          } >> "$GITHUB_STEP_SUMMARY"

          PUBLISHED_IMAGE="logfalcon-${GITHUB_REF_NAME//\//-}-arm6.img.xz"
          mv "${IMAGE_FILE}.xz" "$PUBLISHED_IMAGE"
          {
            echo "IMAGE_FILE=$PUBLISHED_IMAGE"
            echo "IMAGE_PATH=pi-gen/pi-gen-repo/deploy/$PUBLISHED_IMAGE"
          } >> "$GITHUB_ENV"

      - name: Inspect exact image
        run: bash scripts/inspect-image.sh "${{ env.IMAGE_PATH }}"

      - name: Upload image artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload_artifact) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logfalcon-image
          path: ${{ env.IMAGE_PATH }}
          retention-days: 7

  release:
    name: Create Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-binaries, build-image]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/
          pattern: logfalcon-*

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name 'logfalcon-*' -exec cp {} release-assets/ \;
          cp system/*.service system/*.path system/*.timer system/*.sh system/*.rules system/journald.conf release-assets/
          test -n "$(find update-keys -name '*.pub' -print -quit)" || { echo '::error::No trusted update public keys'; exit 1; }
          for key in update-keys/*.pub; do cp "$key" "release-assets/update-key-$(basename "$key")"; done
          (cd release-assets && printf '%s\n' update-key-*.pub > update-keys.txt)
          cp config/logfalcon.toml release-assets/logfalcon-default.toml
          cp boot/logfalcon-config.txt release-assets/logfalcon-boot-config.txt
          printf '%s\n%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > release-assets/logfalcon-build.txt
          git archive --format=tar.gz --prefix=logfalcon/ HEAD > release-assets/logfalcon-source.tar.gz
          git log -1 --format='%H%n%s' > release-assets/logfalcon-source-commit.txt
          cp CHANGELOG.md release-assets/logfalcon-changelog.md
          ls -la release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum -- * > checksums.txt
          cd ..
          cat release-assets/checksums.txt

      - name: Assert release assets
        run: |
          cd release-assets
          required=("logfalcon-arm6" "logfalcon-arm64" "logfalcon-amd64" "logfalcon-build.txt" "logfalcon-source.tar.gz" "50-logfalcon.rules" "logfalcon-config-apply.service" "checksums.txt")
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required release asset: $f"
              exit 1
            fi
          done
          for arch in arm6 arm64 amd64; do test -f "logfalcon-$GITHUB_REF_NAME-$arch.lfu" || { echo "::error::Missing signed update $arch"; exit 1; }; done
          if [ -z "$(find . -maxdepth 1 -type f -name 'logfalcon-*.img.xz')" ]; then
            echo "::error::Missing required release asset: logfalcon-*.img.xz"
            exit 1
          fi
          echo "All required release assets present:"
          find . -maxdepth 1 -type f | sort

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body_path: release-assets/logfalcon-changelog.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
