name: Build SD Card Image

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload image as workflow artifact (useful for testing)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install QEMU for ARM emulation
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Clone pi-gen
        run: git clone --depth 1 --branch bookworm https://github.com/RPi-Distro/pi-gen.git pi-gen/pi-gen-repo

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      # ── Gate 1: Security Scan (Section 3.2) ───────────────────────────────
      # Blocks the pipeline if any known CVEs exist in the dependency graph.
      - name: Security scan — govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # ── Gate 2: Race Detector (Section 3.2) ───────────────────────────────
      # Catches data races before any binary is produced.
      - name: Race detector gate — go test -race
        run: go test -race -count=1 ./...

      - name: Cross-compile logfalcon for ARM
        run: |
          make build-pi
          make build-pi2
          # Fallback binary for QEMU chroot where uname -m returns host arch
          cp bin/logfalcon-arm6 bin/logfalcon
          ls -la bin/

      # ── Gate 3: Binary Size (Section 3.2) ─────────────────────────────────
      # ARM6 binary must stay under 10 MB to keep the final image lean.
      - name: Binary size gate — ARM6 <= 10 MB
        run: |
          BINARY="bin/logfalcon-arm6"
          if [ ! -f "$BINARY" ]; then
            echo "::error::ARM6 binary not found at $BINARY"
            exit 1
          fi

          SIZE_BYTES=$(stat -c%s "$BINARY")
          SIZE_MB=$(( SIZE_BYTES / 1024 / 1024 ))
          LIMIT_MB=10
          LIMIT_BYTES=$(( LIMIT_MB * 1024 * 1024 ))

          echo "ARM6 binary: $(du -h "$BINARY" | cut -f1) ($SIZE_BYTES bytes)"

          if [ "$SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::ARM6 binary is ${SIZE_MB} MB — exceeds ${LIMIT_MB} MB limit"
            exit 1
          fi

          echo "Binary size OK: ${SIZE_MB} MB <= ${LIMIT_MB} MB"

      - name: Configure pi-gen
        run: |
          # Copy our config and custom stage
          cp pi-gen/config pi-gen/pi-gen-repo/config
          rm -rf pi-gen/pi-gen-repo/stage-logfalcon
          cp -r pi-gen/stage-logfalcon pi-gen/pi-gen-repo/stage-logfalcon

          # Copy project source into pi-gen so scripts can access it
          rm -rf pi-gen/pi-gen-repo/logfalcon-src
          rsync -a --exclude='.git' --exclude='pi-gen' \
              ./ pi-gen/pi-gen-repo/logfalcon-src/

          # Skip desktop stages (safety net — STAGE_LIST already limits stages)
          touch pi-gen/pi-gen-repo/stage3/SKIP pi-gen/pi-gen-repo/stage3/SKIP_IMAGES
          touch pi-gen/pi-gen-repo/stage4/SKIP pi-gen/pi-gen-repo/stage4/SKIP_IMAGES
          touch pi-gen/pi-gen-repo/stage5/SKIP pi-gen/pi-gen-repo/stage5/SKIP_IMAGES

          # Don't export images from intermediate stages
          touch pi-gen/pi-gen-repo/stage2/SKIP_IMAGES

      - name: Build image
        run: |
          cd pi-gen/pi-gen-repo
          ./build-docker.sh
        env:
          CLEAN: 1
          CONTINUE: 0
          PRESERVE_CONTAINER: 0

      - name: Shrink and compress image
        run: |
          find pi-gen/pi-gen-repo/deploy -maxdepth 1 -type f -print || true
          cd pi-gen/pi-gen-repo/deploy

          IMAGE_FILE=$(find . -maxdepth 1 -type f -name '*.img' -printf '%f\n' | sort | head -n 1)
          if [ -z "$IMAGE_FILE" ]; then
            echo "::error::No .img file found in deploy directory"
            exit 1
          fi

          # Install PiShrink pinned to a specific commit (v0.1.3 — d2c55e5)
          # instead of the mutable master branch.
          wget -qO /usr/local/bin/pishrink.sh \
            https://raw.githubusercontent.com/Drewsif/PiShrink/d2c55e5/pishrink.sh
          chmod +x /usr/local/bin/pishrink.sh

          RAW_SIZE=$(du -h "$IMAGE_FILE" | cut -f1)
          echo "Raw image:      $RAW_SIZE  ($IMAGE_FILE)"

          sudo /usr/local/bin/pishrink.sh "$IMAGE_FILE"
          SHRUNK_SIZE=$(du -h "$IMAGE_FILE" | cut -f1)
          echo "After PiShrink: $SHRUNK_SIZE  ($IMAGE_FILE)"

          # ── Gate 4: Image Size (Sections 2.5 & 3.2) ─────────────────────
          # Raw image after PiShrink must stay under 600 MB.
          SHRUNK_BYTES=$(stat -c%s "$IMAGE_FILE")
          SHRUNK_MB=$(( SHRUNK_BYTES / 1024 / 1024 ))
          IMAGE_LIMIT_MB=600
          IMAGE_LIMIT_BYTES=$(( IMAGE_LIMIT_MB * 1024 * 1024 ))

          echo "Shrunk image size: ${SHRUNK_MB} MB ($SHRUNK_BYTES bytes)"

          if [ "$SHRUNK_BYTES" -ge "$IMAGE_LIMIT_BYTES" ]; then
            echo "::error::Image size ${SHRUNK_MB} MB >= ${IMAGE_LIMIT_MB} MB limit — size regression detected"
            exit 1
          fi

          echo "Image size OK: ${SHRUNK_MB} MB < ${IMAGE_LIMIT_MB} MB"

          # -9 = highest preset; -T0 = all CPU threads; drop -e (extreme) to save
          # ~5-10 min with negligible size difference on a typical Pi image.
          xz -9 -T0 "$IMAGE_FILE"
          FINAL_SIZE=$(du -h "${IMAGE_FILE}.xz" | cut -f1)
          echo "Compressed:     $FINAL_SIZE  (${IMAGE_FILE}.xz)"

          # Write a human-readable summary to the job summary
          {
            echo "## Image sizes"
            echo "| Stage | Size |"
            echo "|---|---|"
            echo "| Raw .img | $RAW_SIZE |"
            echo "| After PiShrink | $SHRUNK_SIZE |"
            echo "| Final .img.xz | $FINAL_SIZE |"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "IMAGE_NAME=${IMAGE_FILE}.xz"
            echo "IMAGE_PATH=pi-gen/pi-gen-repo/deploy/${IMAGE_FILE}.xz"
          } >> "$GITHUB_ENV"

      - name: Upload artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: logfalcon-image
          path: ${{ env.IMAGE_PATH }}
          retention-days: 7
