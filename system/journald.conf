# LogFalcon — journald size limits to protect the SD card
# Install to: /etc/systemd/journald.conf.d/logfalcon.conf
# Overrides the default 10% of filesystem (~1.6 GB on 16 GB card).
# After installing, run: systemctl restart systemd-journald

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=50M
SystemKeepFree=200M
RuntimeMaxUse=8M
SyncIntervalSec=15s
MaxRetentionSec=1week
